<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crossed Keys">
<meta name="theme-color" content="#3d1119">
<link rel="apple-touch-icon" href="crew/applescreen.png">
<title>Crossed Keys Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
  /* ═══ THEME ═══
     Light "castle daylight": warm limestone, with Sendivogius maroon and alchemical gold.
     The Sendivogius colours: maroon and gold. To change the house look, edit --house, --house-hi,
     --house-deep and --gold below. Everything else follows. --castle is the dark maroon stone used
     for the top bar and the main buttons so the screen keeps some definition. */
  :root {
    --font-body:'Literata', Georgia, serif;   /* easy to read on a phone */
    --font-ui:'Literata', Georgia, serif;     /* labels and buttons */
    --font-display:'Cinzel', Georgia, serif;  /* big titles only, for the castle feel */
    --bg:#f4efe3;        /* limestone */
    --bg2:#ebe4d2;       /* shaded stone */
    --card:#fffdf7;      /* parchment card */
    --raised:#f6e4e4;    /* selected tint */
    --line:#d2c7ae;      /* mortar */
    --text:#1b2829;      /* ink */
    --muted:#566867;     /* soft ink */
    --house:#8c2f3f;     /* Sendivogius maroon */
    --house-hi:#7a1f2e;  /* maroon for text */
    --house-deep:#7a1f2e;/* maroon for buttons */
    --castle:#3d1119;    /* dark castle maroon: top bar */
    --on-dark:#f8eeea;   /* text on dark maroon */
    --gold:#97690f;      /* alchemical gold for text (assumed) */
    --gold-bright:#d4a84b;/* gold for fills */
    --gold-bg:#f6ecd0;
    --ember:#b13f2e;
    --ember-bg:#f8e7e2;
    --ok:#3f8a46;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; background: var(--bg); font-family: var(--font-body); font-size:17px; color: var(--text); overflow: hidden; -webkit-text-size-adjust:100%; }
  #app { height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; background:var(--bg); }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
  input, textarea, button { font-family: inherit; -webkit-appearance: none; border-radius: 0; }
  input, textarea { font-size:16px; }
  button { cursor: pointer; border: none; background: none; color: inherit; touch-action: manipulation; }
  button:active { opacity: 0.7; }
  input:focus, textarea:focus { outline: none; }

  @keyframes fadeIn   { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUp  { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes banterIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
  @keyframes encPop   { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
  @keyframes pulse    { 0%,100% { opacity:1; } 50% { opacity:0.45; } }

  .fade-in   { animation: fadeIn   0.3s ease forwards; }
  .slide-up  { animation: slideUp  0.35s ease forwards; }
  .banter-in { animation: banterIn 0.3s ease forwards; }
  .enc-pop   { animation: encPop   0.25s ease forwards; }
  .pulsing   { animation: pulse 1.2s ease infinite; }

  .display { font-family:var(--font-ui); }
  .row    { display:flex; align-items:center; gap:10px; }
  .spacer { flex:1; }
  .hint { font-size:15px; color:var(--muted); line-height:1.35; }

  /* ── Chrome ── */
  .topbar { display:flex; align-items:center; padding:max(10px,env(safe-area-inset-top)) 16px 10px; flex-shrink:0; background:var(--castle); color:var(--on-dark); gap:10px; }
  .topbar-title { font-family:var(--font-ui); font-size:16px; font-weight:700; letter-spacing:1px; flex:1; text-transform:uppercase; white-space:nowrap; }
  .topbar-sub   { font-size:15px; color:#ecd5d8; }
  .pill-btn { font-family:var(--font-ui); font-size:11px; font-weight:700; letter-spacing:0.5px; padding:8px 10px; white-space:nowrap; border:1.5px solid; text-transform:uppercase; min-height:36px; }

  .navbar { display:flex; padding:4px 8px; padding-bottom:max(6px,env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); flex-shrink:0; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; min-height:56px; border-top:3px solid transparent; }
  .nav-btn.active { border-top-color:var(--house); background:var(--raised); }
  .nav-icon  { font-size:24px; line-height:1; }
  .nav-label { font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .nav-btn.active .nav-label { color:var(--house-hi); }

  .view { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  /* ── Step bar ── */
  .stepbar { display:flex; gap:5px; padding:10px 16px 8px; flex-shrink:0; }
  .step { flex:1; text-align:center; font-family:var(--font-ui); font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#a89f8a; padding-top:6px; border-top:4px solid var(--line); }
  .step.done { color:var(--muted); border-top-color:var(--house); }
  .step.now  { color:var(--house-hi); border-top-color:var(--house-deep); }

  /* ── Home ── */
  .section-head { font-family:var(--font-ui); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }

  .stat-row { display:grid; grid-template-columns:1.4fr 1fr 0.8fr; gap:8px; padding:14px 16px 8px; }
  .stat-card { background:var(--card); border:1px solid var(--line); padding:10px 12px; }
  .stat-val  { font-family:var(--font-ui); font-size:22px; font-weight:700; color:var(--text); line-height:1.1; }
  .stat-label{ font-size:14px; color:var(--muted); margin-top:3px; }

  .meters { margin:0 16px 12px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .meter { background:var(--card); border:1px solid var(--line); padding:10px 12px; }
  .meter-top { display:flex; justify-content:space-between; font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:7px; }
  .meter-track { height:8px; background:var(--bg2); border:1px solid var(--line); }
  .meter-fill { height:100%; transition:width 0.4s ease; }
  .meter-sub { font-size:13px; color:var(--muted); margin-top:5px; }

  .week-card { margin:0 16px 16px; background:var(--card); border:1px solid var(--line); padding:14px; }
  .week-days { display:flex; gap:4px; margin-bottom:10px; }
  .day-dot   { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .day-label { font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .day-mark  { font-size:18px; }
  .progress-track { height:8px; background:var(--bg2); border:1px solid var(--line); overflow:hidden; margin-bottom:6px; }
  .progress-fill  { height:100%; background:linear-gradient(90deg,var(--house),var(--gold-bright)); transition:width 0.4s ease; }
  .progress-text  { font-size:15px; color:var(--muted); }

  .mission-card { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--house); margin-bottom:14px; cursor:pointer; box-shadow:0 1px 3px rgba(40,40,20,0.08); }
  .mission-card.done { opacity:0.55; cursor:default; }
  .mc-type { padding:12px 14px; background:var(--castle); color:var(--on-dark); display:flex; align-items:center; gap:12px; }
  .mc-type-label { font-family:var(--font-ui); font-size:21px; font-weight:700; color:#fff; letter-spacing:1px; }
  .mc-type-sub { font-size:14px; color:#ecd5d8; margin-top:2px; line-height:1.25; }
  .mc-body { padding:12px 14px 10px; }
  .mc-title { font-family:var(--font-ui); font-size:16px; font-weight:700; color:var(--text); line-height:1.3; }
  .mc-loc { font-size:14px; color:var(--muted); margin-top:2px; }
  .mc-sum { font-size:16px; color:var(--text); line-height:1.45; margin-top:8px; }
  .mc-sum b { display:block; font-family:var(--font-ui); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:2px; }
  .mc-foot { padding:10px 14px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; background:var(--bg); gap:8px; }
  .mc-go { font-family:var(--font-ui); font-size:13px; font-weight:700; color:var(--house-hi); letter-spacing:1px; text-transform:uppercase; white-space:nowrap; }

  .tag { display:inline-block; font-family:var(--font-ui); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border:1.5px solid; white-space:nowrap; }

  /* ── Team rows ── */
  .peer-list { display:flex; flex-direction:column; gap:10px; }
  .peer-row { display:flex; align-items:center; gap:14px; background:var(--card); border:2px solid var(--line); padding:12px 14px; min-height:84px; }
  .peer-row.selected { border-color:var(--house); background:var(--raised); }
  .peer-main { flex:1; min-width:0; }
  .companion-name { font-family:var(--font-ui); font-size:17px; font-weight:700; color:var(--text); }
  .companion-role { font-size:15px; color:var(--muted); line-height:1.25; }
  .companion-lv { font-family:var(--font-ui); font-size:12px; font-weight:600; color:var(--muted); margin-top:4px; letter-spacing:0.5px; }
  .peer-check { width:32px; height:32px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; background:var(--card); flex-shrink:0; color:#fff; }
  .peer-row.selected .peer-check { border-color:var(--house-deep); background:var(--house-deep); }
  .fit-row { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .fit-chip { font-family:var(--font-ui); font-size:11px; font-weight:700; letter-spacing:0.5px; padding:2px 7px; border:1.5px solid var(--line); color:var(--muted); text-transform:uppercase; }
  .fit-chip.match { border-color:var(--gold); color:var(--gold); background:var(--gold-bg); }
  .classmate { font-family:var(--font-ui); font-size:11px; font-weight:700; letter-spacing:1px; color:var(--house-hi); text-transform:uppercase; margin-top:3px; }

  .bonus-bar { margin:10px 16px; padding:10px 12px; background:var(--gold-bg); border:1.5px solid var(--gold-bright); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0; }
  .ghost-btn { font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--house-hi); border:2px solid var(--house); padding:10px 12px; background:var(--card); min-height:44px; }

  .back-btn { font-family:var(--font-ui); font-size:14px; font-weight:700; color:var(--house-hi); letter-spacing:1px; padding:10px 0; min-height:44px; background:none; border:none; }
  .primary-btn { width:100%; min-height:56px; padding:14px; background:var(--house-deep); color:#fff; font-family:var(--font-ui); font-size:15px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; border:none; box-shadow:0 2px 0 #4d1019; }
  .primary-btn:active { background:#5e1624; }
  .primary-btn:disabled { opacity:0.4; }
  .footer-bar { padding:12px 16px; padding-bottom:max(12px,env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--card); flex-shrink:0; }

  /* ── Briefing ── */
  .briefing-feed    { padding:12px 16px; min-height:80px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .briefing-msg     { display:flex; gap:10px; margin-bottom:12px; }
  .briefing-bubble  { background:var(--card); border:1px solid var(--line); border-radius:0 12px 12px 12px; padding:12px 14px; flex:1; }
  .briefing-who     { font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .briefing-text    { font-size:18px; color:var(--text); line-height:1.45; }
  .briefing-player  { background:var(--gold-bg); border:1px solid var(--gold-bright); border-radius:12px 0 12px 12px; padding:10px 14px; margin-bottom:12px; margin-left:36px; }
  .briefing-p-who   { font-family:var(--font-ui); font-size:12px; font-weight:700; color:var(--gold); letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
  .briefing-p-text  { font-size:17px; color:var(--text); }
  .briefing-input-row { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); background:var(--card); }
  .briefing-input   { flex:1; min-width:0; padding:12px 14px; background:var(--bg); border:1.5px solid var(--line); font-size:16px; color:var(--text); min-height:48px; }
  .briefing-input::placeholder { color:#8a9795; }
  .briefing-input:focus { border-color:var(--house); }
  .briefing-send    { width:48px; height:48px; background:var(--house-deep); color:#fff; font-size:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:900; }
  .briefing-send:disabled { opacity:0.3; }
  .briefing-thinking { font-size:16px; color:var(--muted); padding:2px 4px; }

  .brief-top { padding:0 16px; flex-shrink:0; }
  .brief-top .stepbar { padding:2px 0 8px; }
  .brief-hero { background:var(--card); border:1px solid var(--line); border-top:4px solid var(--house); padding:16px; margin-bottom:12px; }
  .brief-who { font-size:18px; font-weight:700; }
  .brief-title { font-family:var(--font-display); font-size:19px; font-weight:700; color:var(--text); line-height:1.25; }
  .brief-text { font-size:20px; line-height:1.5; color:var(--text); }
  .brief-card { background:var(--bg2); border:1px solid var(--line); padding:14px; margin-bottom:12px; }
  .brief-wt { font-size:17px; font-weight:600; color:var(--house-hi); margin-bottom:4px; }
  .brief-sum { font-size:17px; line-height:1.45; color:var(--text); }
  .brief-steps { margin:10px 0 0 20px; }
  .brief-steps li { font-size:16px; line-height:1.45; margin-bottom:8px; }
  .link-btn { color:var(--house-hi); font-size:16px; font-weight:600; text-decoration:underline; padding:10px 0 2px; min-height:40px; }
  .plan-box { margin:0 16px 10px; background:var(--card); border:1px solid var(--line); padding:10px 14px; }
  .plan-box ol { padding-left:20px; }
  .plan-box li { font-size:16px; color:var(--text); line-height:1.4; margin-bottom:6px; }

  /* ── Workout ── */
  .workout-header { padding:10px 16px 8px; flex-shrink:0; background:var(--card); border-bottom:1px solid var(--line); }
  .workout-title  { font-family:var(--font-ui); font-size:17px; font-weight:700; color:var(--text); line-height:1.2; }
  .workout-sub    { font-size:14px; color:var(--muted); margin-top:2px; }
  .workout-timer  { font-family:var(--font-ui); font-size:28px; font-weight:700; color:var(--gold); }

  .milestone-track { padding:10px 16px 6px; display:flex; gap:5px; flex-shrink:0; }
  .ms-dot { flex:1; height:8px; background:var(--line); transition:background 0.3s; }
  .ms-dot.done { background:var(--gold-bright); }
  .ms-dot.curr { background:var(--house); animation:pulse 1.5s ease infinite; }

  .now-card { margin:4px 16px 8px; padding:12px 14px; background:var(--raised); border:2px solid var(--house); flex-shrink:0; max-height:38vh; overflow-y:auto; }
  .now-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .now-step { font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--house-hi); }
  .now-title { font-family:var(--font-ui); font-size:18px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .now-do { font-size:18px; color:var(--text); line-height:1.4; }

  .action-bar { padding:8px 16px; flex-shrink:0; }
  .done-btn { width:100%; min-height:60px; background:var(--house-deep); color:#fff; font-family:var(--font-ui); font-size:17px; font-weight:700; letter-spacing:2px; text-transform:uppercase; box-shadow:0 2px 0 #4d1019; }
  .complete-btn { width:100%; min-height:60px; background:var(--gold-bright); color:#2a2006; font-family:var(--font-ui); font-size:17px; font-weight:700; letter-spacing:2px; text-transform:uppercase; box-shadow:0 2px 0 #9a7a25; }

  .now-story { margin-top:10px; padding-top:10px; border-top:1px solid #d9b9bd; font-size:16px; line-height:1.45; color:var(--muted); }
  .latest-line { padding:0 16px; margin-bottom:4px; }
  .event-banner { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 16px 6px; padding:12px 14px; min-height:52px; background:var(--ember-bg); border:2px solid var(--ember); color:var(--ember); font-size:16px; font-weight:700; text-align:left; flex-shrink:0; }
  .event-banner-go { white-space:nowrap; font-size:14px; }
  .rest-chip { margin:0 16px 8px; padding:10px 14px; background:var(--gold-bg); border:2px solid var(--gold-bright); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .rest-time { font-family:var(--font-ui); font-size:24px; font-weight:700; color:var(--gold); }

  .workout-feed { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 16px; min-height:70px; }
  .feed-item { margin-bottom:10px; animation:banterIn 0.3s ease forwards; }
  .feed-milestone { background:var(--card); border-left:4px solid var(--gold-bright); padding:10px 12px; border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .feed-ms-label  { font-family:var(--font-ui); font-size:13px; font-weight:700; color:var(--gold); letter-spacing:1px; margin-bottom:2px; }
  .feed-ms-text   { font-size:16px; color:var(--muted); line-height:1.4; }
  .feed-banter    { display:flex; gap:10px; }
  .feed-banter-bubble { background:var(--card); border:1px solid var(--line); border-radius:0 12px 12px 12px; padding:10px 12px; flex:1; }
  .feed-banter-who    { font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
  .feed-banter-text   { font-size:17px; color:var(--text); line-height:1.4; }
  .feed-player    { background:var(--gold-bg); border:1px solid var(--gold-bright); border-radius:12px 0 12px 12px; padding:10px 12px; margin-left:36px; }
  .feed-p-who     { font-family:var(--font-ui); font-size:12px; font-weight:700; color:var(--gold); letter-spacing:1px; margin-bottom:2px; }
  .feed-p-text    { font-size:16px; color:var(--text); }
  .feed-event     { background:var(--ember-bg); border:2px solid var(--ember); padding:12px 14px; }
  .feed-event-title { font-family:var(--font-ui); font-size:15px; font-weight:700; color:var(--ember); margin-bottom:4px; }
  .feed-event-text  { font-size:17px; color:var(--text); margin-bottom:10px; line-height:1.4; }
  .feed-event-choices { display:flex; flex-direction:column; gap:8px; }
  .feed-event-choice  { padding:12px 14px; min-height:48px; background:var(--card); border:2px solid var(--line); font-size:17px; color:var(--text); text-align:left; }
  .feed-event-choice:active { border-color:var(--ember); }
  .sys-note { margin:2px 0 10px; padding:8px 12px; border:1px dashed var(--ember); background:var(--ember-bg); color:var(--ember); font-size:14px; }
  .feed-event-result  { font-size:16px; color:var(--muted); margin-top:4px; padding-left:10px; border-left:3px solid var(--gold-bright); }

  .workout-input-row { display:flex; gap:8px; padding:8px 16px; padding-bottom:max(10px,env(safe-area-inset-bottom)); border-top:1px solid var(--line); flex-shrink:0; background:var(--card); }
  .workout-input     { flex:1; min-width:0; padding:10px 12px; background:var(--bg); border:1.5px solid var(--line); font-size:16px; color:var(--text); min-height:48px; }
  .workout-input::placeholder { color:#8a9795; }
  .workout-input:focus { border-color:var(--house); }
  .workout-send      { width:48px; height:48px; background:var(--bg2); border:1.5px solid var(--line); color:var(--house-hi); font-size:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .workout-send:disabled { opacity:0.35; }
  .log-btn { padding:0 12px; min-height:48px; background:var(--gold-bg); border:2px solid var(--gold-bright); color:var(--gold); font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:1px; flex-shrink:0; }

  /* ── Lift log ── */
  .log-set-overlay { position:fixed; inset:0; background:rgba(35,12,16,0.6); display:flex; align-items:flex-end; z-index:200; }
  .log-set-panel   { background:var(--card); border-top:3px solid var(--house); padding:18px 16px; padding-bottom:max(18px,env(safe-area-inset-bottom)); width:100%; max-width:480px; margin:0 auto; max-height:92vh; overflow-y:auto; }

/* ═══════════════════════════════════════════════════

const HERO = { id:"sterling", name:"Sterling", full:"Sterling Ashbourne", role:"Guardian candidate", color:"#7a1f2e" };

const WULFRIC = {
  id:"wulfric", name:"Professor Wulfric", initials:"PW", role:"Magical Defence, Sendivogius monitor, Fireball referee. Your adoptive father", icon:"🗝️", color:"#97690f",
  fit:[], tags:["professor"], classmate:false,
  voice:"Terse and strict. Short, firm sentences. No excuses, no softness, no pointless questions. Pushes harder than is comfortable. Occasional dry remark. Rarely smiles, and shows his fondness for Sterling only in small understated ways: a flicker of pride, a practical tip, a bare 'Good.' Sometimes sounds like a Fireball referee (whistle, counting, penalties). Never gushes.",
  bio:"Professor of Magical Defence at Czocha, monitor of the Sendivogius house and referee of Fireball. Strict, demanding and sometimes unfair-seeming, he pushes students to their limits and sometimes beyond. No patience for excuses, bruised egos or pointless theory. Believes Magical Defence should be called Magical Combat, because the best defence is a good offence. Rarely smiles and trusts almost no one. Insists on being called Professor Wulfric or Sir Wulfric and never gives his full name. Before Czocha he served in a highly specialised unit of the Guardian Order; that career ended in an incident he does not discuss. He has softened over the years and is quietly, fiercely fond of Sterling, his adopted daughter, but shows it through standards, practical help and rare dry warmth, never gushing. Never mention the incident or his dismissal unless Sterling raises it, and then answer briefly and carefully.",
};
const FIA = {
  id:"fia", name:"Professor Fia Mallow", initials:"FM", role:"Professor of Beastology. Takes over when beasts are involved", icon:"🐉", color:"#4a6b3a",
  fit:[], tags:["professor"], classmate:false,
  voice:"Bubbly, distractible and endlessly curious. Says 'Fascinating!' and 'Let's see what happens!' Gives hands-on animal tips cheerfully with little thought for safety, then remembers she is supposed to care and adds a hasty disclaimer. Brings up jackalope droppings at any chance. Occasionally nervous about being sacked. Warm, a bit lonely, delighted to have company.",
  bio:"Professor of Beastology at Czocha, in her second year of teaching. Mundaneborn, from a family of bankers who love her from a distance and do not understand her work. She spent years alone in the wilderness researching the droppings of the rare Arctic jackalope, with a theory that droppings produced under a full moon counter certain poisons. She teaches by experience: 'Fascinating! Let's see what happens!' She is loose about safety and discipline (a student was once nearly carried off by a gryphon) and is enthusiastic, scatterbrained and warm. Privately she worries about being sacked and is starting to hope Czocha could become a home and a family. She finds the title Professor Mallow stuffy and would rather be called Fia.",
};
const leadFor = m => m && m.beast ? FIA : WULFRIC;

// Six fellow Senior students, back at Czocha. "sendi:true" marks a fellow Sendivogian (Sterling's own house).
// Rename freely: story text that says "Peer 01" etc. picks up the new name automatically.
const PEERS = [
  { id:"p01", name:"Ines Vargas",    role:"Senior, Guardian path (Combat)", sendi:true,  icon:"🔥", color:"#c4432b", fit:["strength","vr"],    tags:["Blunt","Brawler"],
    voice:"Blunt and competitive. A long-running rivalry with Sterling that is mostly affection. Short sentences. Teases, then helps. Not above celebrating with a bottle afterwards." },
  { id:"p02", name:"Liesl Morrow",   role:"Senior, Guardian path (Bound)",  sendi:true,  icon:"⛓️", color:"#7d4e96", fit:["mobility","strength"], tags:["Calm","Bound"],
    voice:"Calm, measured, a little eerie. Speaks softly and says things that land. Utterly loyal. Never rushes." },
  { id:"p03", name:"Saoirse Quill",  role:"Senior, Curse Breaker path",     sendi:false, icon:"🧭", color:"#1f7fae", fit:["run","pool"],          tags:["Chatty","Fast"],
    voice:"Upbeat and talkative, laughs easily, usually eating something. Fast and knows it. Cheerful even in bad situations." },
  { id:"p04", name:"Tomasz Brandt",  role:"Senior, Alchemy",                sendi:false, icon:"⚗️", color:"#5b8a35", fit:["mobility","vr"],     tags:["Precise","Alchemy"],

const CREW = PEERS;                       // selectable teammates
const ALL_FOLK = [WULFRIC, FIA, ...PEERS, HERO];     // everyone who can appear in a scene

const COMPANION_IMG = {};
ALL_FOLK.forEach(c => { COMPANION_IMG[c.id] = `crew/${c.id}.webp`; });

function CompanionIcon({ id, size=32, style="" }) {
  const [failed, setFailed] = useState(false);
  const c = ALL_FOLK.find(x=>x.id===id);
  const color = c?.color || "#93a5a3";
  const base = `width:${size}px;height:${size}px;border-radius:50%;border:2px solid ${color}88;box-sizing:border-box;flex-shrink:0;${style}`;
  if(COMPANION_IMG[id] && !failed) return h('img', {
    src: COMPANION_IMG[id], alt: c?.name || id,
    style: `${base}object-fit:cover;display:block;`,
    onError: () => setFailed(true),
  });
  const words = c ? c.name.split(" ") : [];
  const label = !c ? "?" : c.initials ? c.initials : /^Peer \d+$/.test(c.name) ? c.name.slice(-2) : words.length>1 ? (words[0][0]+words[words.length-1][0]).toUpperCase() : c.name.slice(0,2).toUpperCase();
  return h('div', {
    style:`${base}background:var(--bg2);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-size:${Math.round(size*0.34)}px;font-weight:700;color:${color};`
  }, label);
}

let MISSIONS = {

      ex:[{n:"Seated Dumbbell Press",sets:3,lo:8,hi:12},{n:"Lat Pulldown",sets:3,lo:8,hi:12},{n:"Incline Dumbbell Press",sets:3,lo:8,hi:12},{n:"Chest-Supported Row",sets:3,lo:10,hi:12},{n:"Lateral Raise",sets:2,lo:12,hi:15},{n:"Cable Curl",sets:2,lo:10,hi:15},{n:"Triceps Pushdown",sets:2,lo:10,hi:15}],

// Lets text refer to peers as "Peer 05" and still show the real name once PEERS is edited.
function applyNames(obj) {
  const s = JSON.stringify(obj).replace(/Peer (\d\d)/g,(m,n)=>{ const p=PEERS[+n-1]; return p?JSON.stringify(p.name).slice(1,-1):m; });
  return JSON.parse(s);
}
MISSIONS = applyNames(MISSIONS);

// Which mission each card shows today.
// Lifting rotates A, B, C in order. Sprints level up every 3 sessions. The rest rotate daily.
function getDailyMissions(gs) {
  const allW=(gs&&gs.allW)||[];
  const today=dayStamp();
  const out={};
  Object.entries(MISSIONS).forEach(([type,pool])=>{
    const ofType=allW.filter(w=>pool.some(m=>m.id===w.arcId));
    const doneToday=ofType.find(w=>w.stamp===today);
    if(doneToday){ out[type]=pool.find(m=>m.id===doneToday.arcId); return; }
    if(type==="strength"){ const last=ofType[ofType.length-1]; out[type]=pool[last?(pool.findIndex(m=>m.id===last.arcId)+1)%pool.length:0]; }
    else if(type==="run") out[type]=pool[Math.min(pool.length-1,Math.floor(ofType.length/3))];
    else out[type]=pool[hash(today+type)%pool.length];
  });
  return out;
}

// Weekly plan: 3 lifting days + 1 conditioning session (sprints, pool or VR).
function weekSummary(gs) {
  const wk=(gs.allW||[]).filter(w=>w&&w.date&&weekKey(w.date)===weekKey());
  return { wk, lifts:wk.filter(w=>w.type==="strength").length, cond:wk.filter(w=>CONDITIONING.includes(w.type)).length };
}
function recommendToday(gs) {
  const allW=gs.allW||[];
  const {lifts,cond}=weekSummary(gs);
  const todayN=dayNum(localDay(new Date()));
  if(allW.some(w=>w.stamp===dayStamp())) return {type:"mobility", why:"You have already trained today. Rest, or add some mobility if you feel like it."};
  const liftedYesterday=allW.some(w=>w.type==="strength"&&todayN-dayNum(localDay(w.date))===1);
  const lastOf=t=>{ const w=[...allW].reverse().find(x=>x.type===t); return w?dayNum(localDay(w.date)):-1; };
  const condPick=[...CONDITIONING].sort((a,b)=>lastOf(a)-lastOf(b))[0];
  if(lifts<3 && !liftedYesterday) return {type:"strength", why:`Lifting day ${lifts+1} of 3 this week.`};
  if(cond<1) return {type:condPick, why:liftedYesterday?"You lifted yesterday, so give those muscles a day off. This week's conditioning session fits today.":"This week's conditioning session."};
  if(lifts<3) return {type:"mobility", why:"You lifted yesterday. Mobility today, then lift again tomorrow."};
  return {type:"mobility", why:"This week's plan is complete. Anything more is a bonus, and mobility helps you recover."};
}

// Suggested team: peers whose specialty matches the workout, rotated daily by mission.
function suggestTeam(mission, size=4) {
  const fits = CREW.filter(c=>c.fit.includes(mission.type));
  return [...fits].sort((a,b)=> hash(dayStamp()+mission.id+a.id) - hash(dayStamp()+mission.id+b.id)).slice(0,size).map(c=>c.id);
}
function teamBonus(ids, type) {
  const n = ids.map(id=>CREW.find(c=>c.id===id)).filter(c=>c && c.fit.includes(type)).length;
  return n * 5; // percent
}

// INVENTED: the path from candidate to Guardian. Thresholds are Order reputation points.
const RANKS = [
  { at:0,    title:"Aspirant" },
  { at:400,  title:"Junior Candidate" },
  { at:1000, title:"Candidate Keybearer" },
  { at:1800, title:"Probationary Guardian" },
  { at:2800, title:"Field Guardian" },
  { at:4000, title:"Senior Field Guardian" },
  { at:5500, title:"Warden's Hand" },
  { at:7500, title:"Keywarden" },
];
function rankFor(rep) {
  let i = 0;
  RANKS.forEach((r,idx)=>{ if(rep>=r.at) i=idx; });
  const next = RANKS[i+1];
  return { idx:i, title:RANKS[i].title, next, toNext: next ? next.at - rep : 0, pct: next ? Math.round(((rep-RANKS[i].at)/(next.at-RANKS[i].at))*100) : 100 };
}

// Streak: training days in a row, allowing one rest day between sessions.
const localDay = d => { const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const dayNum   = s => Math.round(new Date(s+"T12:00:00").getTime()/86400000);
function computeStreak(allW) {
  const days=[...new Set((allW||[]).filter(w=>w&&w.date).map(w=>localDay(w.date)))].sort().reverse();
  if(!days.length) return 0;
  if(dayNum(localDay(new Date()))-dayNum(days[0])>2) return 0;
  let n=1;
  for(let i=1;i<days.length;i++){ if(dayNum(days[i-1])-dayNum(days[i])<=2) n++; else break; }
  return n;
}

/* ── Claude API ── */
const MODEL = "claude-sonnet-5-5";

// Calls the API and turns failures into a plain-English message.
async function callClaude(apiKey, system, messages, max_tokens) {
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:MODEL,max_tokens,system,messages})
    });
  } catch(e) { throw new Error("No connection. Check your signal and try again."); }
  let data=null; try{ data=await res.json(); }catch{}
  if(!res.ok || data?.error) {
    const raw=data?.error?.message||"";
    const low=raw.toLowerCase();
    let msg;
    if(res.status===401) msg="Your API key was rejected. Tap Narrator in the top bar to check it.";
    else if(low.includes("credit")) msg="Your Anthropic account is out of credit. Top up at console.anthropic.com.";
    else if(res.status===403) msg="This API key is not allowed to use the narrator.";
    else if(res.status===429) msg="Too many requests right now. Wait a minute and try again.";
    else if(res.status===404) msg="The narrator model could not be found. The app may need an update.";
    else if(res.status>=500) msg="Anthropic's servers are busy. Try again shortly.";
    else msg=`The narrator hit an error (${res.status}). ${raw}`.trim();
    throw new Error(msg);
  }
  let out=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  if(data.stop_reason==="max_tokens") {   // cut off mid-sentence: keep only complete sentences
    const end=Math.max(out.lastIndexOf(". "),out.lastIndexOf("! "),out.lastIndexOf("? "),out.lastIndexOf(".\n"));
    if(end>20) out=out.slice(0,end+1);
  }
  return out;
}

// Builds a valid message list: starts with the user, alternates roles, ends with the new text.
function toMessages(hist, text, opener) {
  const msgs=[];
  hist.forEach(m=>{ if(!m.content) return; if(msgs.length&&msgs[msgs.length-1].role===m.role) msgs[msgs.length-1].content+="\n"+m.content; else msgs.push({...m}); });
  if(!msgs.length || msgs[0].role!=="user") msgs.unshift({role:"user",content:opener});
  if(msgs[msgs.length-1].role==="user") msgs[msgs.length-1].content+="\n"+text; else msgs.push({role:"user",content:text});
  return msgs;
}
// Turns "Name: what they say" lines into feed items. Never shows raw code to the user.
function parseCastLines(raw, cast){
  const txt=String(raw||"").replace(/```[a-z]*|```/gi,"").trim();
  const out=[];
  const byName=n=>cast.find(c=>c.name===n)||cast[0];
  if(txt.startsWith("{")) {
    try{ const j=JSON.parse(txt); (j.responses||[]).forEach(r=>out.push({c:byName(r.crew),text:String(r.text||"")})); }catch{
      const cut=t=>{ const e=Math.max(t.lastIndexOf("."),t.lastIndexOf("!"),t.lastIndexOf("?")); return e>10?t.slice(0,e+1):t; };   // reply was cut off
      [...txt.matchAll(/"crew"\s*:\s*"([^"]+)"\s*,\s*"text"\s*:\s*"((?:[^"\\]|\\.)*)/g)].forEach(m=>out.push({c:byName(m[1]),text:cut(m[2].replace(/\\"/g,'"'))}));
    }
    if(out.length) return out.slice(0,2);
  }
  const aliases=[];
  cast.forEach(c=>{ const short=c.name.replace(/^Professor\s+/,""); [c.name,short,short.split(" ")[0]].forEach(a=>aliases.push({a:a.toLowerCase(),c})); });
  aliases.sort((x,y)=>y.a.length-x.a.length);
  txt.split(/\n+/).forEach(line=>{
    const l=line.replace(/\*\*/g,"").trim().replace(/^[-*•\s]+/,""); if(!l) return;
    const hit=aliases.find(x=>l.toLowerCase().startsWith(x.a+":"));
    if(hit) out.push({c:hit.c,text:l.slice(hit.a.length+1).trim()});
    else if(out.length) out[out.length-1].text+=" "+l;
    else out.push({c:cast[0],text:l});
  });
  return out.slice(0,2).map(o=>({...o,text:o.text.replace(/^["“']+|["”']+$/g,"").trim()})).filter(o=>o.text && !/^[\[{]/.test(o.text));
}

const noDashes = t => String(t||"").replace(/[\u2013\u2014]/g,",");

/* ── Rest chime ── iOS only allows sound after a tap, so unlockAudio() runs when a set is logged.
   The phone's silent switch will mute it. */
let audioCtx=null;
function unlockAudio(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch{} }
function chime(){
  try{
    if(navigator.vibrate) navigator.vibrate([120,80,120]);
    if(!audioCtx) return;
    const t=audioCtx.currentTime;
    [[0,784],[0.22,1046]].forEach(([d,f])=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.35,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.4);
      o.connect(g); g.connect(audioCtx.destination); o.start(t+d); o.stop(t+d+0.45);
    });
  }catch{}
}

/* ── Backup ── a JSON file with the training history (the API key is never included). */
async function exportBackup(gs){
  const data=JSON.stringify({app:"crossed-keys",version:1,exportedAt:new Date().toISOString(),gs},null,1);
  const name=`crossed-keys-backup-${localDay(new Date())}.json`;
  try{
    const file=new File([data],name,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Crossed Keys backup"}); return "shared"; }
  }catch(e){ if(e && e.name==="AbortError") return "cancelled"; }
  const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  return "downloaded";
}
function parseBackup(text){
  const obj=JSON.parse(text);
  const g=obj && (obj.gs||obj);
  if(!g || !Array.isArray(g.allW)) throw new Error("That file is not a Crossed Keys backup.");
  return { gs:g, exportedAt:obj.exportedAt||null };
}

  return { char:{name:HERO.name,rep:0,body:0,craft:0}, ch, weekKey:weekKey(), weekW:[], allW:[], streak:0, best:0, party:null, lastLift:{} };
}
function loadState() {
  const cur = LS.get(KEY_GS);
  if(cur) {
    const base = freshState();
    return { ...base, ...cur, char:{...base.char,...(cur.char||{})}, ch:{...base.ch,...(cur.ch||{})} };
  }
  const old = LS.get("witcher_gs");   // keep the streak and history from the previous version of the app
  const base = freshState();
  if(old) return { ...base, allW:old.allW||[], weekW:old.weekW||[], weekKey:old.weekKey||base.weekKey, streak:old.streak||0, best:old.best||0, char:{...base.char, rep:old.char?.xp||0} };
  return base;
}

      if(next.has(id)) { if(next.size>1) next.delete(id); }

    h('div',{class:"meter-top",style:`color:${color}`},h('span',null,label),h('span',null,`Tier ${tier}`)),
    h('div',{class:"meter-track"},h('div',{class:"meter-fill",style:`width:${value%100}%;background:${color}`})),
    h('div',{class:"meter-sub"},`${100-(value%100)} to next tier`)
  );
}

              h('div',{style:"flex:1"},

                h('div',{class:"mc-loc"},m.loc)

function WorkoutView({ mission, workoutType, gs, setGs, apiKey, onFinish, startedAt, saved }) {
  const wt    = WORKOUT_TYPES.find(w=>w.id===workoutType) || WORKOUT_TYPES[0];
  const steps = mission.steps;
  const lead  = leadFor(mission);
  const partyIds = (gs.party||[]).filter(id=>CREW.find(c=>c.id===id));
  const crewObjs = (partyIds.length?partyIds:suggestTeam(mission)).map(id=>CREW.find(c=>c.id===id)).filter(Boolean);

  const sv = saved || {};
  const [msIdx,    setMsIdx]   = useState(sv.msIdx||0);
  const [feed,     setFeed]    = useState(sv.feed||[]);
  const [input,    setInput]   = useState("");
  const [thinking, setThinking]= useState(false);
  const [chatOpen, setChatOpen]= useState(false);
  const [eventOpen,setEventOpen]= useState(false);
  const [now,      setNow]     = useState(Date.now());
  const [event,    setEvent]   = useState(sv.event||null);
  const [eventRep, setEventRep]= useState(sv.eventRep||0);
  const [sets,     setSets]    = useState(sv.sets||[]);
  const [logSetOpen,setLogSetOpen]=useState(false);
  const [curEx,    setCurEx]   = useState(null);
  const [weightVal,setWeightVal]=useState("");
  const [repsVal,  setRepsVal] = useState("");
  const [restEnd,  setRestEnd] = useState(sv.restEnd||0);
  const lastLift = gs.lastLift||{};
  const exNames  = (mission.ex||[]).map(e=>e.n);
  const exTarget = n => (mission.ex||[]).find(e=>e.n===n);
  const feedRef = useRef(null);
  const evIdx   = useRef(sv.evIdx||null);
  const evShown = useRef(sv.evShown||[false,false]);

  // Timers come from the clock, so they stay right when the phone locks.
  const elapsed = Math.max(0,Math.floor((now-startedAt)/1000));
  const rest    = restEnd ? Math.max(0,Math.ceil((restEnd-now)/1000)) : 0;
  function startRest(sec){ setRestEnd(sec?Date.now()+sec*1000:0); }

  if(!evIdx.current) {
    const a = Math.floor(Math.random()*FIELD_EVENTS.length);
    let b = Math.floor(Math.random()*FIELD_EVENTS.length);
    if(b===a) b=(a+1)%FIELD_EVENTS.length;
    evIdx.current=[a,b];
  }
  const evPlan = { current: evIdx.current.map(i=>FIELD_EVENTS[i]) };

  const banterFeed = [];
  [lead,...crewObjs].forEach(c=>{ (BANTER[c.id]||[]).forEach(bl=>banterFeed.push({...bl,id:c.id})); });

  function addFeed(item) { setFeed(f=>[...f,item]); }
  function randomBanter(at, fromCrewOnly) {
    const pool = banterFeed.filter(b=>b.at===at && (!fromCrewOnly || b.id!==lead.id));
    if(pool.length){ const m=pick(pool); addFeed({type:"banter",cid:m.id,text:m.line}); }
  }

  useEffect(()=>{
    const tick=()=>setNow(Date.now());
    const clock=setInterval(tick,1000);
    document.addEventListener("visibilitychange",tick);
    let t1;
    if(!saved) {   // fresh start, not a resumed session
      addFeed({type:"milestone",label:steps[0].l,text:steps[0].s});
      t1=setTimeout(()=>{ const pool=banterFeed.filter(b=>b.at==="start"&&b.id===lead.id); const m=pool.length?pick(pool):banterFeed.find(b=>b.at==="start"); if(m) addFeed({type:"banter",cid:m.id,text:m.line}); },3000);
    }
    return()=>{ clearInterval(clock); clearTimeout(t1); document.removeEventListener("visibilitychange",tick); };
  },[]);

  // Keep the screen awake during the session (supported on recent iOS).
  useEffect(()=>{
    let lock=null, gone=false;
    const req=async()=>{ try{ if("wakeLock" in navigator && document.visibilityState==="visible" && !gone) lock=await navigator.wakeLock.request("screen"); }catch{} };
    const onVis=()=>{ if(document.visibilityState==="visible") req(); };
    req(); document.addEventListener("visibilitychange",onVis);
    return()=>{ gone=true; document.removeEventListener("visibilitychange",onVis); try{ lock&&lock.release(); }catch{} };
  },[]);

  // Chime once when the rest timer runs out.
  useEffect(()=>{ if(restEnd && rest===0){ chime(); setRestEnd(0); } },[rest,restEnd]);

  // Save progress so an iOS reload does not lose the session.
  useEffect(()=>{
    LS.set(KEY_ACTIVE,{ missionId:mission.id, type:workoutType, startedAt,
      state:{ msIdx, feed:feed.slice(-40), sets, event, eventRep, restEnd, evIdx:evIdx.current, evShown:evShown.current } });
  },[msIdx,feed,sets,event,eventRep,restEnd]);

  useEffect(()=>{ if(feedRef.current) feedRef.current.scrollTop=feedRef.current.scrollHeight; },[feed,thinking,chatOpen]);

  function advanceStep() {
    const next=msIdx+1;
    setMsIdx(next);
    if(next<steps.length) {
      addFeed({type:"milestone",label:steps[next].l,text:steps[next].s});
      if(Math.random()<0.6) setTimeout(()=>randomBanter(next/steps.length>0.6?"push":"mid", false),1200);
      if(next===2 && !evShown.current[0]) { evShown.current[0]=true; setTimeout(()=>setEvent({...evPlan.current[0],idx:0}),2500); }
      if(next===4 && !evShown.current[1]) { evShown.current[1]=true; setTimeout(()=>setEvent({...evPlan.current[1],idx:1}),2500); }
    }
    startRest(0);
  }

  function chooseEvent(choice) {
    addFeed({type:"event_result",text:choice.out});
    setEvent(null);
    setEventRep(r=>r+choice.rep);   // only banked if the mission is completed
    setEventOpen(false);
  }

  async function sendMsg() {
    const text=input.trim(); if(!text||thinking) return;
    setInput(""); addFeed({type:"player",text});
    if(!apiKey) { setTimeout(()=>randomBanter("mid", false),700); return; }
    setThinking(true);
    try {
      const cur = steps[Math.min(msIdx,steps.length-1)];
      const phase=msIdx>=steps.length?"all steps finished":msIdx===0?"in the warm-up":`on step ${msIdx+1} of ${steps.length} (${cur.l})`;
      const recent=feed.slice(-6).map(f=>{
        if(f.type==="player") return `Sterling: "${f.text}"`;
        if(f.type==="banter"){const c=ALL_FOLK.find(x=>x.id===f.cid); return c?`${c.name}: "${f.text}"`:""; }
        if(f.type==="milestone") return `(scene: ${f.label})`;
        return "";
      }).filter(Boolean).join("\n");
      const cast=[lead,...crewObjs];
      const voiceGuide = cast.map(c=>`${c.name} (${c.role}${c.sendi?", a fellow Sendivogian":""}): ${c.voice}`).join("\n");

      const sys=`You are the Game Master running a live roleplay inside a workout app called the Crossed Keys Training Log, set in the world of the College of Wizardry (Czocha College of Witchcraft and Wizardry, Lower Silesia, Poland).

Sterling Ashbourne is doing a real physical workout right now. She is a young Sendivogian witchard, recently graduated from Czocha, being trained as a candidate for the Guardian Order by her adoptive father, Professor Wulfric, who sets practice missions and assignments for her and the Senior students back at school. Her effort IS the mission. The lifting, running and drills are the fieldwork. That is canonical.

CURRENT MISSION: "${mission.title}" at ${mission.loc}
STORY: ${mission.desc}
WORKOUT TYPE: ${wt.label} (${wt.short})
PHASE: ${phase}. Elapsed: ${Math.floor(elapsed/60)} min. Current step: ${cur.l} (${cur.s})
SENIOR STUDENTS WITH HER: ${crewObjs.map(c=>c.name+" ("+c.role+")").join(", ")}
ABOUT ${lead.name.toUpperCase()}: ${lead.bio}
WATCHING AND ENCOURAGING: ${lead.name} (tips, encouragement and urging come from this professor only${lead.id==='fia'?', because beasts are involved':''})

RECENT SCENE:
${recent||"(the mission has just begun)"}

WORLD RULES: College of Wizardry lore only. Witchards, Mundanes, the Traditions, the Treaties of Avalon and the Iron Key, the Peace of Phalsbourg, Regulators, the Guardian Order (crossed keys, Combat Guardians and Bound Guardians). Creatures from the Bestiary: drakes, wyverns, werewolves (lunacy, wolfsbane), vampires, hobgoblins, merfolk, goblins. Never use Harry Potter terms.

TONE: A mix of campus-caper humour and serious Order fieldwork. Mischief in the corridors, real stakes in the field. These are practice missions, but the stakes should feel real. Keep it grounded and specific.

YOUR JOB: Be a collaborative GM and NPC voice. The team is present in the scene. Show them acting: a creature appears, a ward fails, a Mundane wanders in, a peer makes a questionable call. Drive the scene forward.

HOW TO RESPOND:
- Pick 1 or 2 characters from this list only: ${cast.map(c=>c.name).join(", ")}
- Make them act or speak in the scene. The professor may give a short tip, encouragement or urging, but nobody lectures about the workout or coaches her form.
- 2 to 4 lines total. No monologues.
- NEVER use em dashes or en dashes.
- Never invent real people. Stay within the cast.

CHARACTER VOICES:
${voiceGuide}

FORMAT: 1 or 2 lines only. Each line starts with the character's exact name, a colon, then what they say or do. For example:
${lead.name}: Shoulders down. Again.
No JSON, no markdown, no narration outside those lines. Keep each line under 40 words.`;

      const hist = feed.slice(-8).map(f=>{
        if(f.type==="player") return {role:"user",content:f.text};
        if(f.type==="banter") return {role:"assistant",content:`${ALL_FOLK.find(x=>x.id===f.cid)?.name||f.cid}: ${f.text}`};
        return null;
      }).filter(Boolean);
      const raw=await callClaude(apiKey, sys, toMessages(hist, text, "(The mission begins.)"), 450);
      const lines=parseCastLines(raw, cast);
      if(!lines.length) throw new Error("The reply came back empty. Try again.");
      lines.forEach(o=>addFeed({type:"banter",cid:o.c.id,text:noDashes(o.text)}));
    } catch(err) {
      addFeed({type:"system",text:err.message});
    } finally { setThinking(false); }
  }

  const showLiftLog = workoutType==="strength";
  const allDone = msIdx>=steps.length;
  const cur = steps[Math.min(msIdx,steps.length-1)];
  const latest = [...feed].reverse().find(f=>f.type==="banter"||f.type==="system"||f.type==="event_result");
  const latestC = latest&&latest.type==="banter" ? ALL_FOLK.find(x=>x.id===latest.cid) : null;

  function feedItem(item,i) {
    if(item.type==="milestone") return h('div',{key:i,class:"feed-item"},
      h('div',{class:"feed-milestone"},
        h('div',{class:"feed-ms-label"},item.label),
        h('div',{class:"feed-ms-text"},item.text)
      )
    );
    if(item.type==="banter") {
      const c=ALL_FOLK.find(x=>x.id===item.cid);
      return h('div',{key:i,class:"feed-item"},
        h('div',{class:"feed-banter"},
          h(CompanionIcon,{id:item.cid,size:40}),
          h('div',{class:"feed-banter-bubble"},
            h('div',{class:"feed-banter-who",style:`color:${c?.color||"var(--gold)"}`},c?.name||item.cid),
            h('div',{class:"feed-banter-text"},`"${item.text}"`)
          )
        )
      );
    }
    if(item.type==="player") return h('div',{key:i,class:"feed-item"},
      h('div',{class:"feed-player"},
        h('div',{class:"feed-p-who"},HERO.name),
        h('div',{class:"feed-p-text"},item.text)
      )
    );
    if(item.type==="system") return h('div',{key:i,class:"sys-note"},`Narrator unavailable: ${item.text}`);
    if(item.type==="event_result") return h('div',{key:i,class:"feed-item"},
      h('div',{class:"feed-event-result"},item.text)
    );
    return null;
  }

  return h('div',{class:"view",style:"display:flex;flex-direction:column;height:100%;overflow:hidden;"},
    h('div',{class:"workout-header"},
      h('div',{class:"row"},
        h('div',{style:"font-size:28px"},mission.icon),
        h('div',{style:"flex:1;min-width:0"},
          h('div',{class:"workout-title"},mission.title),
          h('div',{class:"workout-sub"},`${wt.icon} ${wt.label}`)
        ),
        h('div',{class:"workout-timer"},fmtTime(elapsed))
      )
    ),

    h('div',{class:"milestone-track"},
      steps.map((_,i)=>h('div',{key:i,class:`ms-dot${i<msIdx?" done":i===msIdx?" curr":""}`}))
    ),

    // One thing at a time: the current step, then the latest line from the cast.
    h('div',{style:"flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px"},
      !allDone&&h('div',{class:"now-card",style:"max-height:none"},
        h('div',{class:"now-step"},`Step ${msIdx+1} of ${steps.length}`),
        h('div',{class:"now-title"},cur.l),
        h('div',{class:"now-do"},cur.d),
        h('div',{class:"now-story"},cur.s)
      ),
      allDone&&h('div',{class:"now-card"},
        h('div',{class:"now-title"},"All steps done"),
        h('div',{class:"now-do"},"Tap Mission Complete to file your report.")
      ),

      rest>0&&h('div',{class:"rest-chip"},
        h('div',{style:"font-size:14px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase"},"Rest"),
        h('div',{class:"rest-time"},fmtTime(rest)),
        h('button',{class:"ghost-btn",onClick:()=>startRest(0)},"Skip")
      ),

      latest&&h('div',{class:"latest-line fade-in",key:feed.length},
        latestC ? h('div',{class:"feed-banter"},
          h(CompanionIcon,{id:latestC.id,size:40}),
          h('div',{class:"feed-banter-bubble"},
            h('div',{class:"feed-banter-who",style:`color:${latestC.color}`},latestC.name),
            h('div',{class:"feed-banter-text"},`"${latest.text}"`)
          )
        ) : feedItem(latest,0)
      ),
      thinking&&h('div',{class:"hint pulsing",style:"padding:0 16px"},"Someone is about to answer..."),

      h('div',{style:"padding:2px 16px 0"},
        h('button',{class:"link-btn",onClick:()=>setChatOpen(true)},`Story and chat (${feed.filter(f=>f.type!=="milestone").length})`)
      )
    ),

    event&&h('button',{class:"event-banner",onClick:()=>setEventOpen(true)},
      h('span',null,`${event.icon} ${event.title}`),
      h('span',{class:"event-banner-go"},"Decide →")
    ),

    h('div',{class:"action-bar",style:"display:flex;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom))"},
      showLiftLog&&h('button',{class:"log-btn",style:"min-height:60px;padding:0 14px",onClick:()=>setLogSetOpen(true)},"+ SET"),
      allDone
        ? h('button',{class:"complete-btn",style:"flex:1",onClick:()=>onFinish&&onFinish(elapsed,sets,eventRep)},"Mission Complete")
        : h('button',{class:"done-btn",style:"flex:1",onClick:advanceStep},msIdx<steps.length-1?"✓ Step done":"✓ Last step done")
    ),

    // Field event: a small sheet you open when ready.
    eventOpen&&event&&h('div',{class:"log-set-overlay",onClick:e=>{ if(e.target===e.currentTarget) setEventOpen(false); }},
      h('div',{class:"log-set-panel"},
        h('div',{class:"feed-event-title",style:"font-size:19px"},`${event.icon} ${event.title}`),
        h('div',{class:"feed-event-text"},event.text),
        h('div',{class:"feed-event-choices"},
          event.choices.map((ch,i)=>h('button',{key:i,class:"feed-event-choice",onClick:()=>chooseEvent(ch)},ch.label))
        ),
        h('button',{class:"log-set-cancel",onClick:()=>setEventOpen(false)},"Not now")
      )
    ),

    // Story and chat: the full feed plus the chat box.
    chatOpen&&h('div',{class:"log-set-overlay",onClick:e=>{ if(e.target===e.currentTarget) setChatOpen(false); }},
      h('div',{class:"log-set-panel",style:"height:85vh;display:flex;flex-direction:column;padding:14px 0 0"},
        h('div',{class:"row",style:"padding:0 16px 8px;justify-content:space-between"},
          h('div',{class:"log-set-title",style:"margin:0"},"Story and chat"),
          h('button',{class:"ghost-btn",onClick:()=>setChatOpen(false)},"Close")
        ),
        h('div',{class:"workout-feed",ref:feedRef},
          feed.map(feedItem),
          thinking&&h('div',{class:"feed-item pulsing"},
            h('div',{class:"feed-banter"},
              h(CompanionIcon,{id:lead.id,size:40}),
              h('div',{class:"feed-banter-bubble"},h('div',{class:"briefing-thinking"},"..."))
            )
          )
        ),
        showLiftLog&&sets.length>0&&h('div',{class:"set-strip"},
          sets.map((st,i)=>h('div',{key:i,class:"set-chip"},
            h('div',{class:"set-chip-ex"},`${i+1}. ${st.exName}`),
            h('div',{class:"set-chip-d"},`${st.kg}kg × ${st.reps}`)
          ))
        ),
        h('div',{class:"workout-input-row"},
          h('input',{class:"workout-input",value:input,placeholder:"Talk to your team",onInput:e=>setInput(e.target.value),onKeyDown:e=>{if(e.key==="Enter"){e.preventDefault();sendMsg();}},disabled:thinking}),
          h('button',{class:"workout-send",disabled:!input.trim()||thinking,onClick:sendMsg},"➤")
        )
      )
    ),

    logSetOpen&&h('div',{class:"log-set-overlay"},
      h('div',{class:"log-set-panel"},
        h('div',{class:"log-set-title"},"Log Set"),
        h('div',{class:"log-set-prev"},curEx||"Select an exercise"),
        curEx&&(()=>{
          const t=exTarget(curEx), last=lastLift[curEx];
          const target=t?`Target: ${t.sets} sets of ${t.lo} to ${t.hi}${t.unit?" "+t.unit:""}. `:"";
          const tip=!last?"First time: pick a weight you could lift 2 to 3 more times."
            : t&&last.reps>=t.hi?`Last time ${last.kg}kg × ${last.reps}. You hit the top of the range, so go a little heavier today.`
            : `Last time ${last.kg}kg × ${last.reps}. Same weight, aim for one more rep.`;
          return h('div',{class:"log-tip"},target+tip);
        })(),
        h('div',{class:"exercise-picker"},
          [["Today's mission",exNames],...Object.entries(EXERCISES).map(([c,e])=>[c,e.filter(x=>!exNames.includes(x))])].flatMap(([cat,exs])=>exs.map(ex=>
            h('button',{key:ex,class:`ex-pick-btn${curEx===ex?" active":""}${cat==="Today's mission"?" today":""}`,onClick:()=>{
              setCurEx(ex);
              const last=lastLift[ex];
              setWeightVal(last?String(last.kg):"");
            }},
              h('div',{class:"ex-pick-name"},ex),
              h('div',{class:"ex-pick-prev"},lastLift[ex]?`last: ${lastLift[ex].kg}kg × ${lastLift[ex].reps}`:cat)
            )
          ))
        ),
        h('div',{class:"weight-reps-row"},
          h('div',{class:"wr-group"},
            h('label',{class:"wr-label"},"kg"),
            h('input',{class:"wr-input",type:"number",value:weightVal,onInput:e=>setWeightVal(e.target.value),placeholder:"0",inputmode:"decimal"})
          ),
          h('div',{class:"wr-group"},
            h('label',{class:"wr-label"},"Reps"),
            h('input',{class:"wr-input",type:"number",value:repsVal,onInput:e=>setRepsVal(e.target.value),placeholder:"0",inputmode:"numeric"})
          )
        ),
        h('button',{class:"primary-btn",style:"font-size:15px",disabled:!curEx||!weightVal||!repsVal,onClick:()=>{
          setSets(s=>[...s,{exId:curEx,exName:curEx,kg:Number(weightVal),reps:Number(repsVal)}]);
          setGs(g=>({...g,lastLift:{...(g.lastLift||{}),[curEx]:{kg:Number(weightVal),reps:Number(repsVal),date:new Date().toISOString()}}}));
          setRepsVal("");
          setLogSetOpen(false);
          unlockAudio();
          startRest(90);
          addFeed({type:"milestone",label:"Set Logged",text:`${curEx}: ${weightVal}kg × ${repsVal}. Rest timer started.`});
        }},"Log Set"),
        h('button',{class:"log-set-cancel",onClick:()=>setLogSetOpen(false)},"Cancel")
      )
    )
  );
}

function FinishOverlay({ mission, workoutType, elapsed, bonus, eventRep, onSave }) {
  const wt = WORKOUT_TYPES.find(w=>w.id===workoutType)||WORKOUT_TYPES[0];
  const [effort, setEffort] = useState(null);
  const [notes,  setNotes]  = useState("");
  const earned = Math.round(mission.rep*(1+bonus/100));

  return h('div',{class:"finish-overlay enc-pop"},
    h('div',{class:"finish-card"},
      h('div',{class:"finish-title"},"Mission Complete"),
      h('div',{class:"finish-arc"},`${mission.icon} ${mission.title} (${wt.label})`),
      h('div',{class:"hint",style:"font-size:15px;margin-bottom:14px"},`${Math.floor(elapsed/60)} min in the field. +${earned+(eventRep||0)} Order Rep${bonus?` (includes +${bonus}% team bonus)`:""}${eventRep?`, with ${eventRep} from field events`:""}.`),
      h('div',{class:"finish-q",style:"margin-bottom:2px"},"How hard was it?"),
      h('div',{class:"hint",style:"font-size:14px;margin-bottom:8px"},"Harder efforts grow Body and Craft faster."),
      h('div',{class:"effort-grid"},
        EFFORT.map(e=>h('div',{key:e.v,class:`effort-btn${effort===e.v?" selected":""}`,onClick:()=>setEffort(e.v)},
          h('div',{class:"effort-label"},`${e.icon} ${e.label}`),
          h('div',{class:"effort-desc"},e.desc)
        ))
      ),
      h('div',{class:"finish-q",style:"margin-bottom:6px"},"Field Notes"),
      h('textarea',{class:"finish-notes",value:notes,onInput:e=>setNotes(e.target.value),placeholder:"What happened out there today..."}),
      h('button',{class:"finish-save",disabled:!effort,onClick:()=>onSave({effort,notes})},"File the Report")
    )
  );
}

function BackupCard({ gs, setGs, msg, setMsg }) {
  const fileRef=useRef(null);
  async function onExport(){ const r=await exportBackup(gs); setMsg(r==="cancelled"?"":r==="shared"?"Backup ready. Save it to Files or send it to yourself.":"Backup downloaded."); }
  function onFile(e){
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const {gs:g,exportedAt}=parseBackup(String(rd.result));
        const when=exportedAt?new Date(exportedAt).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):"an unknown date";
        if(!confirm(`Replace everything on this phone with the backup from ${when} (${g.allW.length} field reports)?`)) return;
        const base=freshState();
        setGs({...base,...g,char:{...base.char,...(g.char||{})},ch:{...base.ch,...(g.ch||{})},lastLift:g.lastLift||{}});
        setMsg("Backup restored.");
      }catch(err){ setMsg(err.message||"Could not read that file."); }
    };
    rd.readAsText(f);
  }
  return h('div',{class:"journal-entry",style:"border-left-color:var(--house)"},
    h('div',{class:"section-head",style:"margin-bottom:4px"},"Backup"),
    h('div',{class:"hint",style:"font-size:14px;margin-bottom:10px"},"Your history lives only on this phone. Save a backup now and then. Your API key is never included."),
    h('div',{class:"row",style:"gap:8px"},
      h('button',{class:"ghost-btn",style:"flex:1",onClick:onExport},"Save backup"),
      h('button',{class:"ghost-btn",style:"flex:1",onClick:()=>fileRef.current&&fileRef.current.click()},"Restore")
    ),
    h('input',{type:"file",accept:"application/json,.json",ref:fileRef,style:"display:none",onChange:onFile}),
    msg&&h('div',{class:"hint",style:"font-size:14px;margin-top:8px;color:var(--house-hi)"},msg)
  );
}

function JournalView({ gs, setGs }) {
  const allW = gs.allW||[];
  const [msg,setMsg]=useState("");   // lives here so it survives the list redrawing after a restore
  function remove(w){
    if(!confirm(`Delete "${w.title||"this report"}" from ${new Date(w.date).toLocaleDateString("en-GB",{day:"numeric",month:"long"})}? Its reputation will be removed too.`)) return;
    setGs(g=>({
      ...g,
      allW:(g.allW||[]).filter(x=>x.id!==w.id),
      weekW:(g.weekW||[]).filter(x=>!(x.date===w.date)),
      char:{...g.char, rep:Math.max(0,(g.char.rep||0)-(w.rep||0)), body:Math.max(0,(g.char.body||0)-(w.body||0)), craft:Math.max(0,(g.char.craft||0)-(w.craft||0))},
    }));
  }
  if(!allW.length) return h('div',{class:"view fade-in"},
    h('div',{class:"empty-state"},
      h('div',{class:"empty-icon"},"📜"),
      h('div',{class:"empty-text"},"No field reports on file."),
      h('div',{class:"empty-sub"},"Complete your first mission")
    ),
    h('div',{style:"padding:0 16px 24px"},h(BackupCard,{gs,setGs,msg,setMsg}))
  );
  const sorted=[...allW].reverse();
  return h('div',{class:"view fade-in"},
    h('div',{class:"journal-list"},
      h('div',{class:"section-head"},"Field Reports"),
      sorted.map(w=>{
        const ef=EFFORT.find(e=>e.v===w.effort);
        const party=(w.crewIds||[]).map(id=>CREW.find(c=>c.id===id)).filter(Boolean);
        const wt=WORKOUT_TYPES.find(t=>t.id===w.type);
        return h('div',{key:w.id,class:"journal-entry"},
          h('div',{class:"row",style:"margin-bottom:8px"},
            h('span',{style:"font-size:30px"},w.icon||"🗝️"),
            h('div',{style:"flex:1;min-width:0"},
              h('div',{class:"display",style:"font-size:14px;font-weight:700;color:var(--text)"},w.title||"Mission"),
              h('div',{style:"color:var(--house-hi);font-size:14px"},`${wt?wt.label+", ":""}${new Date(w.date).toLocaleDateString("en-GB",{weekday:"long",month:"long",day:"numeric"})}`)
            ),
            w.rep?h('div',{class:"display",style:"color:var(--gold);font-size:15px"},`+${w.rep}`):null
          ),
          h('div',{class:"row",style:"gap:4px;margin-bottom:6px"},
            party.map(c=>h(CompanionIcon,{key:c.id,id:c.id,size:32})),
            h('span',{style:"color:var(--muted);font-size:14px;margin-left:4px"},`${ef?.icon||""} ${ef?.label||""}`)
          ),
          w.notes&&h('div',{class:"journal-note"},`"${w.notes}"`),
          w.sets&&w.sets.length>0&&h('div',{style:"margin-top:8px"},
            (()=>{
              const byEx={};
              w.sets.forEach(s=>{ if(!byEx[s.exId]) byEx[s.exId]={name:s.exName,sets:[]}; byEx[s.exId].sets.push(s); });
              return Object.values(byEx).map(ex=>h('div',{key:ex.name,style:"margin-bottom:6px"},
                h('span',{class:"lift-ex-name"},ex.name+": "),
                h('span',{class:"lift-sets"},ex.sets.map(s=>`${s.kg}kg x${s.reps}`).join(" · "))
              ));
            })()
          ),
          h('div',{style:"text-align:right;margin-top:6px"},
            h('button',{class:"del-btn",onClick:()=>remove(w)},"Delete")
          )
        );
      }),
      h(BackupCard,{gs,setGs,msg,setMsg})
    )
  );
}

function ApiSetup({ currentKey, onSave, onCancel }) {
  const [key,setKey]=useState(currentKey||"");
  return h('div',{class:"view fade-in"},
    h('div',{class:"api-setup"},
      h('div',{class:"display",style:"font-size:12px;font-weight:700;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px"},"AI Narrator"),
      h('h1',null,"Live Team Voices"),
      h('p',null,"Add your Claude API key to unlock live replies from your trainer and teammates. Without it the app still works, using prewritten lines. With it, you can talk to them during briefings and missions and the scene responds."),
      h('p',{style:"margin-top:-8px"},"Your key is stored only on this device and is sent only to the Anthropic API."),
      h('div',{class:"api-hint"},
        h('div',{class:"api-hint-h"},"How to get your key"),
        h('pre',null,"1. Go to console.anthropic.com\n2. Sign in or create a free account\n3. Click API Keys in the sidebar\n4. Create a new key\n5. Paste it below")
      ),
      h('input',{class:"api-input",type:"password",value:key,onInput:e=>setKey(e.target.value),placeholder:"sk-ant-..."}),
      h('button',{class:"api-save",onClick:()=>onSave(key)},"Save Key"),
      currentKey&&h('button',{class:"api-cancel",onClick:onCancel},"Cancel")
    )
  );
}

/* ═══════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════ */

function App() {
  const [gs,      setGsRaw]  = useState(()=>loadState());
  const [workout, setWorkout] = useState(()=>{
    const a=LS.get(KEY_ACTIVE);
    if(a && Date.now()-a.startedAt < 12*3600*1000) { const m=findMission(a.missionId); if(m) return {mission:m,type:a.type,startedAt:a.startedAt,saved:a.state}; }
    LS.del(KEY_ACTIVE);
    return null;
  });
  const [view,    setView]    = useState(()=>workout?"workout":"home");
  const [apiKey,  setApiKey]  = useState(()=>LS.get(KEY_API)||LS.get("witcher_api")||"");
  const [showApi, setShowApi] = useState(false);
  const [inFlow,  setInFlow]  = useState(false);   // true during briefing and team steps
  const [finishing,setFinishing]=useState(null);

  function setGs(updater) {
    setGsRaw(prev=>{
      const next=typeof updater==="function"?updater(prev):updater;
      LS.set(KEY_GS,next);
      return next;
    });
  }

  useEffect(()=>{
    // First launch of this version: persist the migrated state and the carried-over key
    LS.set(KEY_GS,gs);
    if(apiKey && !LS.get(KEY_API)) LS.set(KEY_API,apiKey);
    if(gs.weekKey!==weekKey()) setGs(g=>({...g,weekKey:weekKey(),weekW:[]}));
  },[]);

  function startWorkout(mission,type) { LS.del(KEY_ACTIVE); setWorkout({mission,type,startedAt:Date.now(),saved:null}); setView("workout"); }
  function finishWorkout(elapsed,sets,eventRep) { setFinishing({elapsed,sets,eventRep:eventRep||0}); }
  function leaveWorkout() { LS.del(KEY_ACTIVE); setFinishing(null); setWorkout(null); setView("home"); }

  function saveWorkout({effort,notes}) {
    if(!finishing||!workout) return;
    const mission=workout.mission;
    const party=(gs.party||[]).filter(id=>CREW.find(c=>c.id===id));
    const bonus=teamBonus(party,mission.type);
    const earned=Math.round(mission.rep*(1+bonus/100));
    const bc=(WORKOUT_TYPES.find(w=>w.id===mission.type)||WORKOUT_TYPES[0]).bodyCraft;
    const total=earned+(finishing.eventRep||0);
    const mult=(EFFORT.find(e=>e.v===effort)||{mult:1}).mult;
    const bodyGain=Math.round(bc.body*5*mult), craftGain=Math.round(bc.craft*5*mult);
    const stamp=dayStamp();
    
    const entry={
      id:Date.now().toString(),
      arcId:mission.id, title:mission.title, icon:mission.icon, type:mission.type,
      date:new Date().toISOString(), stamp,
      day:["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()],
      dayIdx:todayIdx(),
      elapsed:finishing.elapsed, rep:total, body:bodyGain, craft:craftGain, effort, notes, sets:finishing.sets, crewIds:party,
    };

    setGs(g=>{
      const newChar={...g.char,rep:(g.char.rep||0)+total,body:(g.char.body||0)+bodyGain,craft:(g.char.craft||0)+craftGain};
      const newCh={...g.ch};
      party.forEach(id=>{
        const prev=newCh[id]||{xp:0,level:1};
        const xp=(prev.xp||0)+earned/Math.max(1,party.length);
        newCh[id]={xp,level:Math.floor(xp/200)+1};
      });
      const wk=g.weekKey===weekKey()?g.weekW:[];
      const newWk=[...wk,{stamp,date:entry.date,day:entry.day,arcId:mission.id}];
      const allW=[...(g.allW||[]),entry];

      const streak=computeStreak(allW);

      return { ...g, char:newChar, ch:newCh, weekKey:weekKey(), weekW:newWk, allW, streak, best:Math.max(g.best||0,streak) };
    });

    LS.del(KEY_ACTIVE);
    setFinishing(null); setWorkout(null); setView("journal");
  }

  const rank = rankFor(gs.char?.rep||0);

  const Top = (right)=>h('div',{class:"topbar"},
    h('div',{class:"topbar-title"},"Crossed Keys"),
    right
  );

  if(showApi) return h('div',{id:"app-inner",style:"display:flex;flex-direction:column;height:100%"},
    Top(h('div',{class:"topbar-sub"},rank.title)),
    h(ApiSetup,{currentKey:apiKey,onSave:k=>{setApiKey(k);LS.set(KEY_API,k);setShowApi(false);},onCancel:()=>setShowApi(false)})
  );

  if(workout&&view==="workout") return h('div',{id:"app-inner",style:"display:flex;flex-direction:column;height:100%"},
    Top(h('button',{class:"pill-btn",style:"color:#f3e4e6;border-color:#f3e4e688",onClick:()=>{ if(confirm("Leave this mission? Nothing will be saved.")) leaveWorkout(); }},"Leave")),
    h(WorkoutView,{ key:workout.startedAt, mission:workout.mission, workoutType:workout.type, startedAt:workout.startedAt, saved:workout.saved, gs, setGs, apiKey, onFinish:finishWorkout }),
    finishing&&h(FinishOverlay,{mission:workout.mission,workoutType:workout.type,elapsed:finishing.elapsed,bonus:teamBonus((gs.party||[]),workout.mission.type),eventRep:finishing.eventRep,onSave:saveWorkout})
  );

  return h('div',{id:"app-inner",style:"display:flex;flex-direction:column;height:100%"},
    Top(h('div',{style:"display:flex;align-items:center;gap:8px"},
      h(CompanionIcon,{id:HERO.id,size:34,style:"border:2px solid #ecd5d8;"}),h('div',{class:"topbar-sub"},HERO.name),
      h('button',{class:"pill-btn",style:`color:${apiKey?"#f3c6cc":"#f3d27f"};border-color:${apiKey?"#f3c6cc99":"#f3d27faa"}`,onClick:()=>setShowApi(true)},apiKey?"Narrator on":"Narrator off")
    )),
    view==="home"   &&h(HomeView,   {gs,setGs,onStartWorkout:startWorkout,apiKey,onFlow:setInFlow}),
    view==="party"  &&h(PartyView,  {gs}),
    view==="journal"&&h(JournalView,{gs,setGs}),
    !(view==="home"&&inFlow)&&h(NavBar,{view,setView})
  );
}

let ready=false;
function boot() {
  if(ready) return; ready=true;
  const el=document.getElementById("app");
  if(el) render(h(App,null),el);
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
</script>
</body>
